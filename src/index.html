<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Blood & Sand · Entrena sin límites</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Gimnasio Blood & Sand: box, fuerza y entrenamiento funcional. Reserva tu clase, agenda tu evaluación gratis y gestiona tu plan." />
    <meta name="theme-color" content="#0e0d0c" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash
      (function () {
        var t;
        try { t = localStorage.getItem("bs:theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        if (t === "light") document.querySelector("meta[name=theme-color]").setAttribute("content", "#faf8f5");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blood&Sand" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" as="image" href="img/hero-480.webp" imagesrcset="img/hero-480.webp 480w, img/hero-800.webp 800w" imagesizes="(min-width: 1024px) 45vw, 100vw" fetchpriority="high" />
  </head>

    <noscript>Activa JavaScript para reservar tus clases.</noscript>
  </body>
</html>
